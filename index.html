      position: absolute;

      /*
       * ปรับค่าตรงนี้เพื่อซ่อนส่วนบนของ GAS

      width: 100%;

      /*
       * เพิ่มความสูงชดเชยส่วนที่ถูกเลื่อนขึ้น
       */
      height: calc(100% + 45px);

      border: 0;
      display: block;
    }
  </style>
</head>
